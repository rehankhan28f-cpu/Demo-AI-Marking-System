<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question Review</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-gray-950 text-white px-8 py-5 flex justify-between items-center">

        <div>
            <h1 class="text-2xl font-bold">
                Question Review
            </h1>

            <p class="text-gray-400 text-sm">
                Review AI extracted questions before approval
            </p>
        </div>

        <a href="/question-papers"
           class="bg-white text-gray-950 px-4 py-2 rounded-lg">
            ← Question Papers
        </a>

    </header>


    <!-- Main -->
    <main class="max-w-5xl mx-auto p-8">

        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">

            <h2 class="text-xl font-bold">
                {{ subject }}
            </h2>

            <p class="text-gray-500 mt-1">
                {{ questions|length }} questions extracted
            </p>

        </div>


        <!-- Questions -->
        {% for question in questions %}

        <div class="bg-white rounded-xl shadow-sm p-6 mb-5">

            <div class="flex justify-between items-center mb-4">

                <h3 class="text-lg font-bold">
                    Question {{ loop.index }}
                </h3>

                <span class="bg-gray-100 px-3 py-1 rounded-lg text-sm">
                    {{ question.max_marks }} Marks
                </span>

            </div>


            <!-- Question -->
            <label class="block text-sm font-semibold mb-2">
                Question
            </label>

            <textarea
                class="w-full border rounded-lg p-3 mb-5"
                rows="3">{{ question.question_text }}</textarea>


            <!-- Model Answer -->
            <label class="block text-sm font-medium mt-4 mb-2">
                Model Answer
            </label>

            <textarea
                name="model_answer_{{ loop.index0 }}"
                rows="4"
                class="w-full border rounded-lg p-3"
                placeholder="Enter the expected/model answer..."></textarea>

        {% endfor %}


        <!-- Approve -->
        <div class="text-right">

            <form method="POST" action="/approve-questions/{{ paper_id }}">

                <button
                    type="submit"
                    class="bg-gray-950 text-white px-6 py-3 rounded-lg hover:bg-gray-800">

                    ✓ Approve Questions

                </button>

            </form>

        </div>

        </div>

    </main>

</body>
</html>
