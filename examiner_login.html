<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Examiner Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<div class="min-h-screen bg-gray-100 py-6 flex flex-col justify-center sm:py-12">

    <div class="relative py-3 sm:max-w-xl sm:mx-auto">

        <!-- Background Shape -->
        <div class="absolute inset-0 bg-gradient-to-r from-cyan-400 to-sky-500 shadow-lg transform -skew-y-6 sm:skew-y-0 sm:-rotate-6 sm:rounded-3xl">
        </div>

        <!-- Login Card -->
        <div class="relative px-4 py-10 bg-white shadow-lg sm:rounded-3xl sm:p-20">

            <div class="max-w-md mx-auto">

                <div>
                    <h1 class="text-2xl font-semibold">
                        Examiner Login
                    </h1>

                    <p class="text-gray-500 mt-2">
                        Login to evaluate assigned answer sheets.
                    </p>
                </div>

                <div class="divide-y divide-gray-200">

                    <div class="py-8 text-base leading-6 space-y-6 text-gray-700 sm:text-lg sm:leading-7">

                        <!-- Email -->
                        <div class="relative">
                            <form method="POST" action="/examiner-login">

                                    <input
                                        autocomplete="off"
                                        id="email"
                                        name="email"
                                        type="email"
                                        class="peer placeholder-transparent h-10 w-full border-b-2 border-gray-300 text-gray-900 focus:outline-none focus:border-cyan-500"
                                        placeholder="Email address"
                                    />

                                    <label
                                        for="email"
                                        class="absolute left-0 -top-3.5 text-gray-600 text-sm
                                        peer-placeholder-shown:text-base
                                        peer-placeholder-shown:text-gray-400
                                        peer-placeholder-shown:top-2
                                        transition-all
                                        peer-focus:-top-3.5
                                        peer-focus:text-gray-600
                                        peer-focus:text-sm">
                                        Email Address
                                    </label>

                                </div>


                                <!-- Password -->
                                <div class="relative">

                                    <input
                                        autocomplete="off"
                                        id="password"
                                        name="password"
                                        type="password"
                                        class="peer placeholder-transparent h-10 w-full border-b-2 border-gray-300 text-gray-900 focus:outline-none focus:border-cyan-500"
                                        placeholder="Password"
                                    />

                                    <label
                                        for="password"
                                        class="absolute left-0 -top-3.5 text-gray-600 text-sm
                                        peer-placeholder-shown:text-base
                                        peer-placeholder-shown:text-gray-400
                                        peer-placeholder-shown:top-2
                                        transition-all
                                        peer-focus:-top-3.5
                                        peer-focus:text-gray-600
                                        peer-focus:text-sm">
                                        Password
                                    </label>

                                </div>
        

                                <!-- Submit -->
                                <div class="relative">

                                    <button
                                        type="submit"
                                        class="bg-cyan-500 hover:bg-cyan-600 text-white rounded-md px-5 py-2">
                                        Login
                                    </button>
                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
